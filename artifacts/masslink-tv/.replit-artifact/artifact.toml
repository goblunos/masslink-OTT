kind = "web"
previewPath = "/"
title = "Masslink OTT"
description = "A durable live-TV web app with searchable country-filtered channels, verified HLS playback, bounded hover previews, a modal player, native HLS captions, and opt-in backend AI live subtitles with transcripts."
version = "1.0.0"
id = "artifacts/masslink-tv"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/masslink-tv run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/masslink-tv", "run", "build" ]
serve = "static"
publicDir = "artifacts/masslink-tv/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/"
