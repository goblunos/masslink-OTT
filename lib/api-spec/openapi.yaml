openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: channels
    description: Live TV catalog and stream verification
  - name: captions
    description: Opt-in live caption sessions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: List live channels
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: country
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Channel catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
  /channels/{channelId}/verify:
    post:
      operationId: verifyChannel
      tags: [channels]
      summary: Verify a stream and discover native captions
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamVerification" }
  /captions/sessions:
    post:
      operationId: startCaptionSession
      tags: [captions]
      summary: Start an opt-in AI caption session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptionSessionInput" }
      responses:
        "201":
          description: Caption session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionSession" }
        "429":
          description: Caption capacity reached
  /captions/sessions/{sessionId}:
    get:
      operationId: getCaptionSession
      tags: [captions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current caption session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptionSession" }
    delete:
      operationId: stopCaptionSession
      tags: [captions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Caption session stopped
  /captions/sessions/{sessionId}/cues:
    get:
      operationId: listCaptionCues
      tags: [captions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Timestamped caption cues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CaptionCue" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NativeCaptionTrack:
      type: object
      required: [id, label, language, default]
      properties:
        id: { type: string }
        label: { type: string }
        language: { type: string }
        default: { type: boolean }
    Channel:
      type: object
      required: [id, name, country, countryCode, category, logo, streamUrl, viewers, featured]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        countryCode: { type: string }
        category: { type: string }
        logo: { type: string }
        streamUrl: { type: string, format: uri }
        viewers: { type: integer }
        featured: { type: boolean }
    StreamVerification:
      type: object
      required: [channelId, available, checkedAt, latencyMs, nativeCaptions]
      properties:
        channelId: { type: string }
        available: { type: boolean }
        checkedAt: { type: string, format: date-time }
        latencyMs: { type: integer }
        error: { type: ["string", "null"] }
        nativeCaptions:
          type: array
          items: { $ref: "#/components/schemas/NativeCaptionTrack" }
    CaptionSessionInput:
      type: object
      required: [channelId, streamUrl, language]
      properties:
        channelId: { type: string, minLength: 1, maxLength: 200 }
        streamUrl:
          type: string
          format: uri
          description: Retained for client compatibility; the server resolves the stream from its trusted catalog.
        language:
          type: string
          maxLength: 20
          pattern: '^(auto|[A-Za-z]{2,8})$'
          description: Use auto for automatic detection
    CaptionSession:
      type: object
      required: [id, channelId, status, language, createdAt, expiresAt, cueCount]
      properties:
        id: { type: string }
        channelId: { type: string }
        status:
          type: string
          enum: [starting, listening, reconnecting, stopped, error, unsupported]
        language: { type: string }
        detectedLanguage: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        cueCount: { type: integer }
    CaptionCue:
      type: object
      required: [id, startMs, endMs, text, language, final]
      properties:
        id: { type: integer }
        startMs: { type: integer }
        endMs: { type: integer }
        text: { type: string, description: English translation of the spoken cue }
        language: { type: string, description: Always en for live caption cues }
        final: { type: boolean }

